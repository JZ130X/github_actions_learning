name: Eighth Workflow
on:
  workflow_dispatch:
    inputs:
      titleCustom:
        description: "Title of the issue"
        type: string
        required: true
        default: "Default title"

jobs:
  run-first-command:
    runs-on: ubuntu-latest
    steps:
      - name: Cron
        run: |
          echo "Title: ${{ inputs.titleCustom }}"
